<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyun İndirme Paneli</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle, #1a1a2e, #0f0f1b);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .panel-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #00fff0;
            text-shadow: 0 0 10px rgba(0, 255, 240, 0.3);
        }

        p {
            font-size: 14px;
            color: #8a8f98;
            margin-bottom: 30px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .game-card:hover {
            transform: translateY(-3px);
            border-color: #00fff0;
        }

        .game-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #ffffff;
        }

        .download-btn {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #00fff0, #0088ff);
            color: #000;
            font-weight: bold;
            text-decoration: none;
            border-radius: 10px;
            transition: opacity 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 255, 240, 0.2);
        }

        .download-btn:hover {
            opacity: 0.9;
            box-shadow: 0 6px 20px rgba(0, 255, 240, 0.4);
        }
    </style>
</head>
<body>

    <div class="panel-container">
        <h1>Oyun İndirme Paneli</h1>
        <p>İndirmek istediğiniz oyunun butonuna tıklayın</p>

        <!-- CAR PARKING -->
        <div class="game-card">
            <div class="game-title">Car Parking Multiplayer</div>
            <a href="https://multiplayerparking.com/apk/car-parking-multiplayer-v4.9.9.apk" target="_blank" class="download-btn">İndir (APK)</a>
        </div>

        <!-- MINECRAFT -->
        <div class="game-card">
            <div class="game-title">Minecraft</div>
            <a href="https://cloud.mail.ru/public/KbyR/tPA1fH7Tc" target="_blank" class="download-btn">İndir (APK)</a>
        </div>

        <!-- NULL'S BRAWL STARS -->
        <div class="game-card">
            <div class="game-title">Null's Brawl Stars</div>
            <a href="https://dnull.xyz/latest_bs" target="_blank" class="download-btn">İndir (APK)</a>
        </div>
    </div>

</body>
</html>
