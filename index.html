<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyun İndirme Paneli</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle, #1a1a2e, #0f0f1b);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .panel-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #00fff0;
            text-shadow: 0 0 10px rgba(0, 255, 240, 0.3);
        }

        p {
            font-size: 14px;
            color: #8a8f98;
            margin-bottom: 25px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .game-card:hover {
            transform: translateY(-3px);
            border-color: #00fff0;
        }

        .game-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #ffffff;
        }

        .download-btn {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #00fff0, #0088ff);
            color: #000;
            font-weight: bold;
            text-decoration: none;
            border-radius: 10px;
            transition: opacity 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 255, 240, 0.2);
            text-align: center;
        }

        .download-btn:hover {
            opacity: 0.9;
            box-shadow: 0 6px 20px rgba(0, 255, 240, 0.4);
        }

        hr {
            border: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 25px 0;
        }

        .comment-section {
            text-align: left;
        }

        .comment-section h2 {
            font-size: 18px;
            color: #00fff0;
            margin-bottom: 15px;
        }

        .comment-input, .name-input {
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            margin-bottom: 10px;
            outline: none;
            font-size: 14px;
        }

        .comment-input {
            resize: none;
            height: 60px;
        }

        .comment-input:focus, .name-input:focus {
            border-color: #00fff0;
        }

        .submit-comment-btn {
            width: 100%;
            padding: 10px;
            background: #222;
            border: 1px solid #00fff0;
            color: #00fff0;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .submit-comment-btn:hover {
            background: #00fff0;
            color: #000;
        }

        .comments-list {
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
        }

        .comment-item {
            background: rgba(255, 255, 255, 0.02);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid #00fff0;
            font-size: 13px;
        }

        .comment-author {
            font-weight: bold;
            color: #0088ff;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="panel-container">
        <h1>Oyun İndirme Paneli</h1>
        <p>İndirmek istediğiniz oyunun butonuna tıklayın</p>

        <div class="game-card">
            <div class="game-title">Car Parking Multiplayer</div>
            <a href="#" target="_blank" class="download-btn">İndir (APK)</a>
        </div>

        <div class="game-card">
            <div class="game-title">Minecraft</div>
            <a href="#" target="_blank" class="download-btn">İndir (APK)</a>
        </div>

        <div class="game-card">
            <div class="game-title">Null's Brawl Stars</div>
            <a href="#" target="_blank" class="download-btn">İndir (APK)</a>
        </div>

        <hr>

        <div class="comment-section">
            <h2>Yorumlar (Herkes Görebilir)</h2>
            <input type="text" id="nameInput" class="name-input" placeholder="Adınız...">
            <textarea id="commentInput" class="comment-input" placeholder="Yorumunuzu buraya yazın..."></textarea>
            <button id="submitBtn" class="submit-comment-btn">Yorum Gönder</button>

            <div class="comments-list" id="commentsList">
                <div class="comment-item">
                    <div class="comment-author">Sistem</div>
                    <div>Yorumlar yükleniyor...</div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

        const SUPABASE_URL = "https://bmjbmoejylecdcrgendz.supabase.co";
        // BURAYA: tırnak işaretlerini silmeden sadece içini temizleyip anon keyini yapıştır:
        const SUPABASE_ANON_KEY = "sb_publishable_EJqiyDVkxJlwvOJf1rk_dw_eKSS2W_g";

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        async function loadComments() {
            const list = document.getElementById('commentsList');
            
            const { data, error } = await supabase
                .from('comments')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                list.innerHTML = `<div class="comment-item" style="border-left-color: red;">Hata: ${error.message}</div>`;
                return;
            }

            list.innerHTML = '';

            if(!data || data.length === 0) {
                list.innerHTML = '<div class="comment-item">Henüz yorum yapılmamış. İlk yorumu sen yaz!</div>';
                return;
            }

            data.forEach(item => {
                const newComment = document.createElement('div');
                newComment.className = 'comment-item';
                newComment.innerHTML = `<div class="comment-author">${escapeHTML(item.name)}</div><div>${escapeHTML(item.comment)}</div>`;
                list.appendChild(newComment);
            });
        }

        async function addComment() {
            const name = document.getElementById('nameInput').value.trim();
            const comment = document.getElementById('commentInput').value.trim();

            if(name === "" || comment === "") {
                alert("Lütfen adınızı ve yorumunuzu yazın!");
                return;
            }

            const { error } = await supabase
                .from('comments')
                .insert([{ name: name, comment: comment }]);

            if (error) {
                alert("Yorum gönderilemedi: " + error.message);
            } else {
                document.getElementById('nameInput').value = "";
                document.getElementById('commentInput').value = "";
                loadComments();
            }
        }

        // Buton tıklamasını bağlama
        document.getElementById('submitBtn').addEventListener('click', addComment);

        // Sayfa yüklenince otomatik çalıştır
        loadComments();
    </script>

</body>
</html>
