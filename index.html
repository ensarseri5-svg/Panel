<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Ensar Gamer Zone - v1.2 Beta Dalı</title>
    <style>
        :root { --beta-purple: #9900ff; --dark-bg: #0a0a12; --card-bg: #120a1c; }
        body { background: var(--dark-bg); color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .panel { width: 100%; max-width: 450px; background: var(--card-bg); padding: 20px; border-radius: 25px; border: 2px solid var(--beta-purple); position: relative; box-shadow: 0 0 20px rgba(153, 0, 255, 0.3); }
        h1 { text-align: center; color: var(--beta-purple); text-transform: uppercase; margin-bottom: 5px; font-size: 22px; }
        .btn { padding: 12px; background: var(--beta-purple); color: #fff; font-weight: bold; border-radius: 8px; border: none; width: 100%; margin-bottom: 10px; cursor: pointer; text-align: center; font-size: 14px; text-decoration: none; display: block; box-sizing: border-box; }
        .game-card { background: #1e1e30; padding: 15px; border-radius: 15px; margin-bottom: 10px; border-left: 5px solid var(--beta-purple); }
        .cat-title { color: var(--beta-purple); font-size: 16px; font-weight: bold; margin-bottom: 15px; text-transform: uppercase; border-bottom: 1px solid var(--beta-purple); padding-bottom: 5px; margin-top: 20px; }
        .login-input { width: 100%; padding: 12px; background: #111; border: 1px solid var(--beta-purple); color: #fff; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; text-align: center; }
        
        /* AI Kısmı */
        .ai-section { background: #1e1e30; padding: 15px; border-radius: 15px; margin-top: 20px; border-top: 3px solid var(--beta-purple); }
        .ai-qa-btn { background: #251f35; color: #d8b4fe; border: 1px solid var(--beta-purple); padding: 8px; border-radius: 6px; font-size: 12px; text-align: left; width: 100%; margin-bottom: 5px; cursor: pointer; }
        #ai-box { background: #111; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 13px; display: none; }
    </style>
</head>
<body>

    <!-- GİRİŞ EKRANI (BETA ŞİFRESİ) -->
    <div class="panel" id="beta-auth-panel">
        <h1>BETA Geliştirici Girişi</h1>
        <p style="text-align:center; font-size:12px; color:#aaa; margin-top:0;">Bu dala erişmek için geliştirici şifresini girin.</p>
        <input type="password" id="beta-pass" class="login-input" placeholder="4 Haneli Beta Şifresi">
        <button class="btn" onclick="checkBetaLogin()">BETA SİSTEMİNE BAĞLAN</button>
    </div>

    <!-- v1.2 GİZLİ BETA İÇERİĞİ -->
    <div class="panel" id="beta-main-panel" style="display:none;">
        <h1>Ensar Zone v1.2 Beta</h1>
        <p style="text-align:center; font-size:12px; color:#aaa; margin-top:-10px;">GitHub Özel Geliştirici Katmanı</p>
        
        <div class="cat-title">🎮 Beta Oyunlar (Sadece 3 Adet)</div>
        <div class="game-card"><h3>Null's Brawl</h3><a href="https://dnull.xyz/latest_bs" target="_blank" class="btn">İNDİR</a></div>
        <div class="game-card"><h3>Car Parking</h3><a href="https://multiplayerparking.com/apk/car-parking-multiplayer-v4.9.9.apk" target="_blank" class="btn">İNDİR</a></div>
        <div class="game-card"><h3>Roblox</h3><a href="https://www.apkmirror.com/apk/roblox-corporation/roblox/" target="_blank" class="btn">İNDİR</a></div>

        <!-- KALİTELİ YAPAY ZEKA DESTEK -->
        <div class="ai-section">
            <h3 style="margin-top:0; color:var(--beta-purple);">🤖 Kaliteli AI Destek</h3>
            <button class="ai-qa-btn" onclick="askAI(1)">❓ Soru 1: Sitenin tam sürüm (v1.1) özellikleri nelerdir?</button>
            <button class="ai-qa-btn" onclick="askAI(2)">❓ Soru 2: Giriş sistemi nasıl çalışır?</button>
            <button class="ai-qa-btn" onclick="askAI(3)">❓ Soru 3: Kurucu Ensar kimdir?</button>
            <div id="ai-box"></div>
        </div>
        
        <!-- ANA DALA (MAIN) DÖNÜŞ LİNKİ -->
        <a href="https://kullanici_adin.github.io/ensar-gamer-zone/" class="btn" style="background:#333; color:white; margin-top:20px;">◀ ANA SÜRÜME DÖN (main)</a>
    </div>

    <script>
        function checkBetaLogin() {
            const pass = document.getElementById('beta-pass').value.trim();
            if(pass === '1836') {
                alert("Geliştirici doğrulaması başarılı! v1.2 Beta aktif.");
                document.getElementById('beta-auth-panel').style.display = 'none';
                document.getElementById('beta-main-panel').style.display = 'block';
            } else {
                alert("Hatalı Beta Şifresi! Erişim engellendi.");
            }
        }

        function askAI(id) {
            const box = document.getElementById('ai-box');
            box.style.display = 'block';
            if(id === 1) {
                box.innerHTML = "🤖 <b>AI:</b> v1.1 sürümünde her oyun aktiftir, PC oyunları ise yakında çıkış tarihleriyle listelenmiştir.";
            } else if(id === 2) {
                box.innerHTML = "🤖 <b>AI:</b> Herkes kendi belirlediği bilgilerle girebilir ama Kurucu şifresi sistemi yönetici moduna alır.";
            } else if(id === 3) {
                box.innerHTML = "🤖 <b>AI:</b> Ensar bu projenin kurucusu, tek yetkilisi ve baş geliştiricisidir.";
            }
        }
    </script>
</body>
</html>
