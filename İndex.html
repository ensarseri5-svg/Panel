<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Ensar Gamer Zone - Premium</title>
    <style>
        :root { --neon-blue: #00fff0; --dark-bg: #0a0a12; --card-bg: #161625; }
        body { background: var(--dark-bg); color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .panel { width: 100%; max-width: 450px; background: var(--card-bg); padding: 20px; border-radius: 25px; border: 2px solid #222; position: relative; }
        h1 { text-align: center; color: var(--neon-blue); text-transform: uppercase; margin-bottom: 20px; font-size: 22px; }
        .btn { padding: 12px; background: var(--neon-blue); color: #000; font-weight: bold; border-radius: 8px; border: none; width: 100%; margin-bottom: 10px; cursor: pointer; text-align: center; font-size: 14px; text-decoration: none; display: block; box-sizing: border-box; }
        .logout-btn { background: #ff4444; color: white; padding: 5px 10px; font-size: 12px; font-weight: bold; border-radius: 5px; border: none; cursor: pointer; position: absolute; top: 20px; right: 20px; }
        .category-panel { display: none; background: #11111e; padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #333; }
        .game-card { background: #1e1e30; padding: 15px; border-radius: 15px; margin-bottom: 10px; border-left: 5px solid var(--neon-blue); }
        .game-card.coming-soon { border-left: 5px solid #ff7700; }
        .date-text { color: #ff7700; font-size: 12px; font-weight: bold; margin-top: 5px; display: block; }
        .cat-title { color: #fff; font-size: 16px; font-weight: bold; margin-bottom: 15px; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .login-input { width: 100%; padding: 12px; background: #111; border: 1px solid #444; color: #fff; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; }
        
        /* Beta Butonu */
        @keyframes rgb-anim { 0%{filter:hue-rotate(0deg);} 100%{filter:hue-rotate(360deg);} }
        .beta-btn { background: linear-gradient(90deg, #ff0000, #ff00ff, #0000ff, #00ffff, #00ff00, #ffff00, #ff0000); background-size: 400%; animation: rgb-anim 3s linear infinite; color: white; margin-top: 15px; }

        /* Yorumlar Alanı */
        .comment-section { background: #1e1e30; padding: 15px; border-radius: 15px; margin-top: 20px; border-top: 3px solid var(--neon-blue); }
        .comment-box { background: #111; max-height: 150px; overflow-y: auto; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 13px; text-align: left; min-height: 40px; }
        .comment-msg { margin-bottom: 8px; padding-bottom: 5px; border-bottom: 1px solid #222; }
        .no-comments { color: #555; font-style: italic; text-align: center; }
    </style>
</head>
<body>

    <!-- GİRİŞ SİSTEMİ -->
    <div class="panel" id="login-panel">
        <h1>Giriş Sistemi</h1>
        <input type="text" id="login-user" class="login-input" placeholder="Kullanıcı Adı">
        <input type="password" id="login-pass" class="login-input" placeholder="Şifre">
        <button class="btn" style="background:#ffcc00;" onclick="checkLogin()">SİTEYE GİRİŞ YAP</button>
    </div>

    <!-- v1.1 ANA SÜRÜM -->
    <div class="panel" id="main-panel" style="display:none;">
        <button class="logout-btn" onclick="logout()">❌ Çıkış Yap</button>
        <h1 id="title" style="margin-top: 25px;">Ensar Zone v1.1</h1>

        <button class="btn" style="background:#00fff0; color:#000;" onclick="toggleCategory('mobile-sect')">📱 MOBILE GAMES</button>
        <button class="btn" style="background:#00fff0; color:#000;" onclick="toggleCategory('pc-sect')">💻 PC GAMES</button>

        <div id="mobile-sect" class="category-panel">
            <div class="cat-title">📱 Mobil Oyunlar</div>
            <div class="game-card"><h3>Null's Brawl</h3><a href="https://dnull.xyz/latest_bs" target="_blank" class="btn">İNDİR</a></div>
            <div class="game-card"><h3>Car Parking</h3><a href="https://multiplayerparking.com/apk/car-parking-multiplayer-v4.9.9.apk" target="_blank" class="btn">İNDİR</a></div>
            <div class="game-card"><h3>Minecraft</h3><a href="https://cloud.mail.ru/public/KbyR/tPA1fH7Tc" target="_blank" class="btn">İNDİR</a></div>
            <div class="game-card"><h3>Roblox</h3><a href="https://www.apkmirror.com/apk/roblox-corporation/roblox/" target="_blank" class="btn">İNDİR</a></div>
        </div>

        <div id="pc-sect" class="category-panel">
            <div class="cat-title">💻 PC Games</div>
            <div class="game-card"><h3>Forza Horizon 6</h3><a href="https://gofile.io/d/WfNPB3" target="_blank" class="btn">İNDİR</a></div>
            <div class="game-card coming-soon">
                <h3>Age of History 3</h3>
                <span class="date-text">⏳ DURUM: Yakında Eklenecek...</span>
            </div>
        </div>

        <div class="comment-section">
            <h3 style="margin-top:0; color:var(--neon-blue); font-size:16px;">💬 Ziyaretçi Yorumları</h3>
            <div class="comment-box" id="comments">
                <div class="no-comments" id="no-comm-txt">Henüz yorum yapılmamış.</div>
            </div>
            <input type="text" id="comment-input" placeholder="Yorum yaz..." style="width:74%; padding:8px; background:#111; border:1px solid #444; color:#fff; border-radius:5px;">
            <button onclick="addComment()" style="width:21%; padding:8px; background:var(--neon-blue); border:none; border-radius:5px; font-weight:bold; cursor:pointer;">OK</button>
        </div>

        <a href="https://kullanici_adin.github.io/ensar-gamer-zone/beta" class="btn beta-btn">🚀 SÜRÜM 1.2 BETA DALINA GEÇ</a>
    </div>

    <script>
        let currentUser = "Ziyaretçi";
        function checkLogin() {
            const user = document.getElementById('login-user').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            if(user === "" || pass === "") { alert("Boş bırakma!"); return; }
            if(pass === '1453') currentUser = "Kurucu Ensar 👑";
            else currentUser = user;
            document.getElementById('login-panel').style.display = 'none';
            document.getElementById('main-panel').style.display = 'block';
        }
        function logout() {
            document.getElementById('main-panel').style.display = 'none';
            document.getElementById('login-panel').style.display = 'block';
        }
        function toggleCategory(id) {
            const sect = document.getElementById(id);
            sect.style.display = (sect.style.display === "block") ? "none" : "block";
        }
        function addComment() {
            const input = document.getElementById('comment-input');
            if(input.value.trim() !== "") {
                const box = document.getElementById('comments');
                const noCommTxt = document.getElementById('no-comm-txt');
                if(noCommTxt) noCommTxt.remove();
                box.innerHTML += `<div class="comment-msg"><b>${currentUser}:</b> ${input.value}</div>`;
                input.value = "";
            }
        }
    </script>
</body>
</html>
