<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Ensar Gamer Zone</title>
    <style>
        :root { --neon-blue: #00fff0; --dark-bg: #0a0a12; --card-bg: #161625; }
        body { background: var(--dark-bg); color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .panel { width: 100%; max-width: 450px; background: var(--card-bg); padding: 20px; border-radius: 25px; border: 2px solid #222; position: relative; }
        h1 { text-align: center; color: var(--neon-blue); text-transform: uppercase; margin-bottom: 20px; margin-top: 10px; }
        .btn { padding: 12px; background: var(--neon-blue); color: #000; font-weight: bold; border-radius: 8px; border: none; width: 100%; margin-bottom: 10px; cursor: pointer; text-decoration: none; display: block; text-align: center; box-sizing: border-box; }
        .exit-btn { position: absolute; top: 15px; right: 15px; background: #ff3333; color: #fff; border: none; border-radius: 50%; width: 30px; height: 30px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .game-card { background: #1e1e30; padding: 15px; border-radius: 15px; margin-bottom: 15px; border-left: 5px solid var(--neon-blue); }
        #up-div { display: none; background: #222; padding: 15px; border-radius: 10px; margin-bottom: 15px; text-align: center; border: 1px solid var(--neon-blue); }
        .bar { width: 100%; height: 8px; background: #444; border-radius: 4px; margin-top: 10px; }
        #fill { width: 0%; height: 100%; background: var(--neon-blue); transition: width 2s; }
        
        /* Sohbet ve Yorumlar Bölümü */
        .chat-section { background: #1e1e30; padding: 15px; border-radius: 15px; margin-top: 25px; border-top: 3px solid var(--neon-blue); }
        .chat-section h2 { font-size: 18px; color: var(--neon-blue); margin-top: 0; }
        .chat-input { width: 100%; padding: 10px; background: #111; border: 1px solid #444; color: #fff; border-radius: 6px; margin-bottom: 8px; font-family: sans-serif; box-sizing: border-box; }
        .chat-box { max-height: 200px; overflow-y: auto; margin-top: 10px; background: #111; padding: 8px; border-radius: 6px; display: flex; flex-direction: column-reverse; }
        .chat-msg { background: #222; padding: 8px; border-radius: 5px; margin-bottom: 6px; font-size: 13px; border-left: 3px solid var(--neon-blue); text-align: left; }
        .chat-msg b { color: var(--neon-blue); }
        .badge { background: #ffcc00; color: #000; padding: 2px 5px; border-radius: 4px; font-size: 10px; margin-right: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="panel" id="main-panel">
        <button class="exit-btn" onclick="exitSite()">X</button>

        <h1>Ensar Gamer Zone</h1>

        <button class="btn" style="background:#ff4444;" onclick="check()">GÜNCELLEME DENETLE</button>
        <div id="up-div">
            <div id="txt">Sistem kontrol ediliyor...</div>
            <div class="bar"><div id="fill"></div></div>
        </div>
        
        <button class="btn" onclick="showSection('mobile')">MOBİL OYUNLAR</button>
        <button class="btn" onclick="showSection('pc')">PC OYUNLARI</button>

        <!-- MOBİL OYUNLAR (HEPSİ BAKIMDA) -->
        <div id="mobile-section">
            <div class="game-card"><h3>Null's Brawl</h3><button class="btn" onclick="check()">BAKIMDA</button></div>
            <div class="game-card"><h3>Car Parking</h3><button class="btn" onclick="check()">BAKIMDA</button></div>
            <div class="game-card"><h3>Minecraft</h3><button class="btn" onclick="check()">BAKIMDA</button></div>
            <div class="game-card"><h3>Roblox</h3><button class="btn" onclick="check()">BAKIMDA</button></div>
        </div>

        <!-- PC OYUNLARI -->
        <div id="pc-section" style="display:none;">
            <div class="game-card"><h3>Forza Horizon 6</h3><button class="btn" onclick="check()">BAKIMDA</button></div>
            <div class="game-card"><h3>Age of History 3</h3><span class="btn" style="background:#444; color:#aaa; cursor:not-allowed;">YAKINDA</span></div>
            <div class="game-card"><h3>Spider-Man 2</h3><span class="btn" style="background:#444; color:#aaa; cursor:not-allowed;">YAKINDA</span></div>
        </div>

        <!-- CANLI SOHBET KUTUSU -->
        <div class="chat-section">
            <h2>💬 Canlı Sohbet Odası</h2>
            <input type="text" id="chat-user" class="chat-input" placeholder="Kullanıcı Adınız">
            <textarea id="chat-text" class="chat-input" rows="2" placeholder="Mesajınızı buraya yazın..."></textarea>
            <button class="btn" style="padding:8px; font-size:14px; margin-bottom:0;" onclick="sendMsg()">Mesaj Gönder</button>
            
            <div class="chat-box" id="chat-box">
                <div class="chat-msg"><span class="badge">Kurucu</span><b>Ensar:</b> Tüm oyunlar eklendi ve sistem şu an genel bakımda beyler! 🔥</div>
            </div>
        </div>
    </div>

    <script>
        function exitSite() { if(confirm("Siteden çıkış yapmak istiyor musunuz?")) { document.getElementById('main-panel').innerHTML = "<h2 style='text-align:center; color:#ff3333;'>Güle Güle!<br>Ensar Gamer Zone kapatıldı.</h2>"; } }
        function showSection(s) { document.getElementById('mobile-section').style.display = (s === 'mobile') ? 'block' : 'none'; document.getElementById('pc-section').style.display = (s === 'pc') ? 'block' : 'none'; }
        
        function check() {
            const div = document.getElementById('up-div');
            const fill = document.getElementById('fill');
            const txt = document.getElementById('txt');
            div.style.display = 'block'; fill.style.width = '0%'; txt.innerText = "Sistem kontrol ediliyor...";
            setTimeout(() => { fill.style.width = '100%'; }, 100);
            setTimeout(() => { txt.innerHTML = "<b>DİKKAT: BAKIM MODU AKTİF!</b><br>Tüm dosyalar şu an bakımda."; }, 2100);
        }

        function sendMsg() {
            const name = document.getElementById('chat-user').value.trim();
            const text = document.getElementById('chat-text').value.trim();
            if(!name || !text) { alert('Lütfen isim ve mesaj alanını doldurun!'); return; }
            
            const box = document.getElementById('chat-box');
            const newMsg = document.createElement('div');
            newMsg.className = 'chat-msg';
            
            if(name.toLowerCase() === 'ensar') {
                newMsg.innerHTML = `<span class="badge">Kurucu</span><b>Ensar:</b> ${text}`;
            } else {
                newMsg.innerHTML = `<b>${name}:</b> ${text}`;
            }
            
            box.insertBefore(newMsg, box.firstChild);
            document.getElementById('chat-text').value = '';
        }
    </script>
</body>
</html>
